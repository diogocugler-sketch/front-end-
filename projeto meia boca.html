<!DOCTYPE html>
<html lang="br-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multimidias</title>
    
    <!-- Estilização Completa e Moderna Interna -->
    <style>
        /* Reset e Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0c;
            color: #f4f4f6;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Topo da Página */
        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        header img {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        h1 {
            color: aqua;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        header h2 {
            color: #888;
            font-size: 1.2rem;
            font-weight: 400;
        }

        /* Menu / Rank de Produtos */
        .containers {
            background: #121214;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .containers h2 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #29292e;
            padding-bottom: 10px;
        }

        .containers nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
            list-style: none;
        }

        .containers li {
            background: #1c1c1f;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }

        .containers li:hover {
            transform: translateX(5px);
            background: #202024;
        }

        .containers a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #e1e1e6;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: 500;
        }

        .containers img {
            border-radius: 6px;
            object-fit: cover;
            background: #fff;
        }

        /* Container Principal do Conteúdo */
        main.dento {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Seções Gerais (Formulários, Vídeos, Etc) */
        section {
            background: #121214;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 25px;
        }

        section h3 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-left: 4px solid aqua;
            padding-left: 10px;
        }

        /* Elementos de Formulário */
        label {
            display: block;
            margin-bottom: 8px;
            color: #c4c4cc;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"], 
        input[type="tel"], 
        input[type="email"], 
        select, 
        textarea {
            width: 100%;
            padding: 12px;
            background: #09090a;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: aqua;
            outline: none;
        }

        /* Estilização para Checkbox e Radio */
        .checkbox-group, .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group label, .radio-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: normal;
            margin-bottom: 0;
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: aqua;
            width: 18px;
            height: 18px;
        }

        input[type="file"], input[type="date"] {
            background: #09090a;
            color: #fff;
            border: 1px solid #29292e;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* Botões */
        button {
            background: aqua;
            color: #0a0a0c;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #00cccc;
        }

        /* Seção Específica de Orçamento (Verde Escuro) */
        #orcamento {
            background: linear-gradient(135deg, #063516, #0b4d22);
            border: 2px solid blue;
            box-shadow: 0 4px 15px rgba(0, 0, 255, 0.2);
        }

        #orcamento input {
            background: #031a0b;
            border-color: #1b6232;
        }

        #orcamento button {
            background: blue;
            color: white;
        }

        #orcamento button:hover {
            background: #0000cd;
        }

        /* Mídias Externas (Vídeo e Mapas) */
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        iframe {
            width: 100%;
            border-radius: 8px;
            border: none;
        }

        /* Rodapé de Página */
        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #29292e;
            width: 100%;
            max-width: 600px;
        }

        footer p {
            color: #7c7c8a;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        footer ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        footer a {
            color: aqua;
            text-decoration: none;
            font-size: 0.9rem;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer img {
            border-radius: 4px;
            opacity: 0.8;
            display: block;
            margin: 10px auto 0 auto;
        }
    </style>
</head>
